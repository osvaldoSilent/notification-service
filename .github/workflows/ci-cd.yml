steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para SonarCloud
          
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Unit Tests & Cucumber
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/notification_db
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: adminpassword
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: mvn clean verify # Corrección: quitamos sonar:sonar de aquí

      - name: SonarCloud Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=REEMPLAZAR_POR_TU_ORG \
            -Dsonar.projectKey=REEMPLAZAR_POR_TU_PROJECT_KEY \
            -Dsonar.qualitygate.wait=true
          # Corrección: Cambiado ./mvnw por mvn