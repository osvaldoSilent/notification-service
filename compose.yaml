services:
  pubsub-emulator:
    image: 'gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators'
    container_name: notification-service-pubsub-emulator
    command: gcloud beta emulators pubsub start --project=osvaldevops-local --host-port=0.0.0.0:8085
    ports:
      - '8085:8085'

  mailpit:
    image: 'axllent/mailpit:latest'
    container_name: notification-service-mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

  sonarqube:
    image: 'sonarqube:community'
    container_name: notification-service-sonarqube
    ports:
      - '9000:9000'
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
