spring:
  application:
    name: notification-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:notification-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.osvaldevops.notifications.infrastructure.adapter.in.messaging.dto.UserCreatedMessagePayload
        spring.json.use.type.headers: false

app:
  kafka:
    topics:
      user-created: ${KAFKA_USER_CREATED_TOPIC:user-created-events}
  notifications:
    sender-address: ${NOTIFICATION_SENDER_EMAIL:no-reply@osvaldevops.com}

server:
  port: 8082

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

