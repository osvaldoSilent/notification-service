spring:
  application:
    name: notification-service
  main:
    lazy-initialization: true
    banner-mode: off
  threads:
    virtual:
      enabled: true

  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  pubsub:
    subscriber-enabled: ${PUBSUB_SUBSCRIBER_ENABLED:true}
    subscriptions:
      user-created: ${PUBSUB_USER_CREATED_SUBSCRIPTION}
  notifications:
    sender-address: ${NOTIFICATION_SENDER_EMAIL}
    mail-enabled: ${MAIL_ENABLED:true}

server:
  port: ${PORT:8082}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.osvaldevops.notifications: INFO
